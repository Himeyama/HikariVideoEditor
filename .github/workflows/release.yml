name: Build Windows installer

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version (e.g. 0.1.0); uploads artifacts only'
        required: true
        default: '0.1.0'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    defaults:
      run:
        working-directory: VideoEditor
    steps:
      - uses: actions/checkout@v4
        with:
          path: VideoEditor
      - name: Check out HSIS v0.6.1
        uses: actions/checkout@v4
        with:
          repository: Himeyama/hsis
          ref: v0.6.1
          path: hsis
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GITHUB_EVENT_NAME -eq 'push') { $env:GITHUB_REF_NAME.Substring(1) } else { $env:INPUT_VERSION }
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Expected vMAJOR.MINOR.PATCH tag or MAJOR.MINOR.PATCH input' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Prepare HSIS LZMA2 compression
        shell: pwsh
        run: ./installer/Prepare-Hsis.ps1 -HsisSource ../hsis
      - name: Build HSIS v0.6.1
        shell: pwsh
        run: |
          $toolPath = Join-Path $env:RUNNER_TEMP 'hsis-v0.6.1'
          dotnet publish ../hsis/src/Hsis.Cli/Hsis.Cli.csproj -c Release -r win-x64 --self-contained true -o $toolPath
          if ($LASTEXITCODE -ne 0) { throw 'HSIS build failed' }
          "HSIS_PATH=$(Join-Path $toolPath 'hsis.exe')" >> $env:GITHUB_ENV
      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: ./installer/build-installer.ps1 -Version $env:APP_VERSION -HsisPath $env:HSIS_PATH
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VideoEditor-${{ steps.version.outputs.version }}-win-x64
          path: |
            VideoEditor/artifacts/installer/*-Setup.exe
            VideoEditor/artifacts/installer/*-Setup.exe.sha256
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME ./artifacts/installer/*-Setup.exe ./artifacts/installer/*-Setup.exe.sha256 --verify-tag --generate-notes --title "VideoEditor $env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
