name: Build Windows installer

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version (e.g. 0.1.0); uploads artifacts only'
        required: true
        default: '0.1.0'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ($env:GITHUB_EVENT_NAME -eq 'push') { $env:GITHUB_REF_NAME.Substring(1) } else { $env:INPUT_VERSION }
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Expected vMAJOR.MINOR.PATCH tag or MAJOR.MINOR.PATCH input' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
      - name: Build installer
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: ./installer/build-installer.ps1 -Version $env:APP_VERSION
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VideoEditor-${{ steps.version.outputs.version }}-win-x64
          path: |
            artifacts/installer/*-Setup.exe
            artifacts/installer/*-Setup.exe.sha256
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME ./artifacts/installer/*-Setup.exe ./artifacts/installer/*-Setup.exe.sha256 --verify-tag --generate-notes --title "VideoEditor $env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
