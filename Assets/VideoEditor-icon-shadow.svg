<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <title>VideoEditor</title>
  <desc>Three blue timeline clips with a white playhead, inspired by Windows Fluent design.</desc>
  <defs>
    <linearGradient id="top" x1="40" y1="40" x2="164" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#36DDF2"/>
      <stop offset="1" stop-color="#0788F5"/>
    </linearGradient>
    <linearGradient id="middle" x1="64" y1="104" x2="208" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#148EFF"/>
      <stop offset="1" stop-color="#0056EC"/>
    </linearGradient>
    <linearGradient id="bottom" x1="104" y1="168" x2="216" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#39D8EF"/>
      <stop offset="1" stop-color="#0791F5"/>
    </linearGradient>
    <linearGradient id="playhead" x1="120" y1="36" x2="128" y2="224" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9F4FF"/>
    </linearGradient>
    <filter id="clip-shadow" x="0" y="0" width="256" height="256" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#063E7D" flood-opacity="0.20"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#002E60" flood-opacity="0.14"/>
    </filter>
    <clipPath id="clips">
      <rect x="32" y="44" width="152" height="52" rx="12"/>
      <rect x="60" y="108" width="164" height="52" rx="12"/>
      <rect x="100" y="172" width="124" height="52" rx="12"/>
    </clipPath>
    <filter id="playhead-shadow" x="104" y="28" width="44" height="208" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <g filter="url(#clip-shadow)">
  <rect x="32" y="44" width="152" height="52" rx="12" fill="url(#top)"/>
  <rect x="60" y="108" width="164" height="52" rx="12" fill="url(#middle)"/>
  <rect x="100" y="172" width="124" height="52" rx="12" fill="url(#bottom)"/>
  </g>
  <g clip-path="url(#clips)">
    <path d="M128 48V222" stroke="#003A93" stroke-opacity="0.32" stroke-width="10" stroke-linecap="round" filter="url(#playhead-shadow)"/>
  </g>
  <path d="M124 42V222" stroke="url(#playhead)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="124" cy="42" r="10" fill="#FFFFFF"/>
</svg>
